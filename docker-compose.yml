services:
  jekyll:
    build: .
    image: odcambc-website:development
    init: true
    command: /usr/local/bin/site-preview
    ports:
      - "127.0.0.1:${JEKYLL_HOST_PORT:-8080}:8080"
      - "127.0.0.1:${JEKYLL_LIVERELOAD_PORT:-35729}:35729"
    volumes:
      - .:/srv/jekyll
      - site_node_modules:/srv/jekyll/node_modules
    environment:
      JEKYLL_ENV: development
      JEKYLL_DESTINATION: /tmp/odcambc-site

volumes:
  site_node_modules:
