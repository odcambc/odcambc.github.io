name: Prettier code formatter

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Check formatting
        id: prettier
        run: npm exec --no -- prettier . --check
      - name: Prepare suggested formatting patch
        if: failure() && steps.prettier.conclusion == 'failure'
        run: |
          npm exec --no -- prettier . --write || true
          git diff > prettier.patch
      - uses: actions/upload-artifact@v4
        if: failure() && steps.prettier.conclusion == 'failure'
        with:
          name: prettier-patch
          path: prettier.patch
          retention-days: 7
