name: Security checks

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies-and-regressions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Verify vendored Prism matches its package and security patch
        run: |
          npm run sync:distill-prism
          git diff --exit-code -- assets/js/distillpub/prism.js assets/js/distillpub/PRISM-LICENSE.txt
      - run: npm run test:security
      - run: npm audit --audit-level=low
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - run: gem install bundler-audit --version 0.9.3 --no-document
      - run: bundle-audit check --update
