name: Check site links

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: built-site
          path: _site/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check routes, content, and internal links
        run: python3 test/site_contract.py --site _site
